name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build (Release)
        run: dotnet build src/MagicalPrincess.SaveEditor/MagicalPrincess.SaveEditor.csproj -c Release
